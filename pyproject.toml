[project]
name = "chaincrafter-rag"
version = "0.1.0"
description = ""
authors = [
    { name = "Rudolf Olah", email = "rudolf.olah.to@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chaincrafter @ git+https://github.com/rudolfolah/chaincrafter.git@92084e12e4cd434d0f514f821faa90fa3bdecb46#subdirectory=python",
    "docling==2.84.0",
    "unstructured[md,pdf]==0.20.8", # 0.22.0+ requires newer versions of wrapt and conflicts with arize-phoenix
    "numpy==2.4.4",
    "faiss-cpu==1.13.2",
    "openai==3.48.0",
    "arize-phoenix==13.21.0", # 13.22.0+ requires graphql-core>=3.3.0a0
    "rank-bm25==0.2.2",
    "sentence-transformers==5.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not ollama'"
markers = [
    "ollama: real local Ollama integration (requires a running service and cached models)",
]

[tool.ruff]
target-version = "py312"
